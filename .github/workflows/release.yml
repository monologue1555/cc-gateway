name: CC Gateway pre-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cc-gateway-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  PNPM_VERSION: "10.12.3"
  NODE_VERSION: "20"
  RELEASE_VERSION: "0.1.0"

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Universal
            os: macos-14
            target: universal-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Verify Rust targets
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin x86_64-apple-darwin' || matrix.target }}"
          installed="$(rustup target list --installed)"
          for target in ${expected}; do
            grep -Fxq "${target}" <<<"${installed}"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CC Gateway release identity
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const pkg=require("./package.json"); const tauri=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")); if(pkg.name!=="cc-gateway"||pkg.version!==process.env.RELEASE_VERSION||tauri.version!==process.env.RELEASE_VERSION||tauri.productName!=="CC Gateway"||tauri.identifier!=="io.github.monologue1555.ccgateway"||tauri.bundle.createUpdaterArtifacts!==false||tauri.plugins?.updater) process.exit(1)'
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$(node -p 'require("./package.json").version')" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version" >&2
            exit 1
          fi

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test:unit
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Run three-protocol gateway E2E
        run: cargo test --manifest-path src-tauri/Cargo.toml proxy::agent_gateway_tests

      - name: Verify Windows Installer script engines
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engines = @(
            @{ Registrar = "$env:windir\System32\regsvr32.exe"; Dll = "$env:windir\System32\vbscript.dll" },
            @{ Registrar = "$env:windir\System32\regsvr32.exe"; Dll = "$env:windir\System32\jscript.dll" },
            @{ Registrar = "$env:windir\SysWOW64\regsvr32.exe"; Dll = "$env:windir\SysWOW64\vbscript.dll" },
            @{ Registrar = "$env:windir\SysWOW64\regsvr32.exe"; Dll = "$env:windir\SysWOW64\jscript.dll" }
          )
          foreach ($engine in $engines) {
            & $engine.Registrar /s $engine.Dll
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to register $($engine.Dll)"
            }
          }

          $probe = Join-Path $env:RUNNER_TEMP 'cc-gateway-wix-script-probe.vbs'
          Set-Content -Path $probe -Encoding ascii -Value 'WScript.Quit 0'
          foreach ($hostPath in @("$env:windir\System32\cscript.exe", "$env:windir\SysWOW64\cscript.exe")) {
            & $hostPath //B //NoLogo $probe
            if ($LASTEXITCODE -ne 0) {
              throw "Windows Script Host probe failed: $hostPath"
            }
          }

      - name: Build unsigned bundles
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload Windows bundler diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: cc-gateway-windows-bundler-diagnostics
          path: |
            src-tauri/target/${{ matrix.target }}/release/wix/**
            src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: warn

      - name: Package macOS portable ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mkdir -p release-staging/CC-Gateway
          cp -R \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/CC Gateway.app" \
            release-staging/CC-Gateway/
          cp LICENSE NOTICE release-staging/CC-Gateway/
          ditto -c -k --sequesterRsrc --keepParent \
            release-staging/CC-Gateway \
            "release-assets/CC-Gateway_v${{ env.RELEASE_VERSION }}_macOS-universal.zip"
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/
          cd release-assets
          shasum -a 256 * > SHA256SUMS-macOS.txt

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive `
            -Path "src-tauri/target/${{ matrix.target }}/release/cc-gateway.exe",LICENSE,NOTICE `
            -DestinationPath "release-assets/CC-Gateway_v${{ env.RELEASE_VERSION }}_Windows-x64-portable.zip"
          Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" |
            Copy-Item -Destination release-assets
          Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" |
            Copy-Item -Destination release-assets
          Get-ChildItem release-assets -File |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii release-assets/SHA256SUMS-Windows.txt

      - name: Include license notices
        shell: bash
        run: |
          cp LICENSE NOTICE release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cc-gateway-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  prerelease:
    name: Publish unsigned pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cc-gateway-*
          path: release-assets
          merge-multiple: true

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CC Gateway ${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease \
            --notes "Unsigned preview build. macOS Gatekeeper and Windows SmartScreen may require manual confirmation. Verify downloads with the included SHA-256 files."
